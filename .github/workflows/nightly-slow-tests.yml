name: Nightly slow tests

# Scene tests that each take over half a minute (up to ~15 on a 4-core machine) skip in the
# per-PR `npm test` unless RUN_SLOW_TESTS is set; `test:slow` sets it and runs their files.
# Run from the Actions tab with "Run workflow" to check a branch on demand.
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow:
    name: Slow scene tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # The scene tests import frontend packages (matter-js and others).
      - run: npm install --no-audit --no-fund --prefix frontend
      - run: npm run test:slow
